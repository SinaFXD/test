<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="آزمایشگاه سیاست پولی فدرال رزرو — شبیه‌ساز آموزشی و ساده‌شده با داده‌های رسمی و به‌روز FRED. Fed Policy Lab — an educational, simplified Fed policy simulator."
    />
    <meta name="theme-color" content="#070d1c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Fed Policy Lab | آزمایشگاه سیاست پولی فدرال رزرو</title>
    <script>
      // Apply saved theme/lang before first paint (no flash). Storage may be unavailable.
      (function () {
        try {
          var raw = localStorage.getItem('fpl:prefs');
          var p = raw ? JSON.parse(raw) : {};
          var theme = p.theme === 'light' || p.theme === 'dark' ? p.theme : 'dark';
          var lang = p.lang === 'en' ? 'en' : 'fa';
          var q = new URLSearchParams(location.search);
          if (q.get('lang') === 'en' || q.get('lang') === 'fa') lang = q.get('lang');
          if (q.get('theme') === 'light' || q.get('theme') === 'dark') theme = q.get('theme');
          var el = document.documentElement;
          el.setAttribute('data-theme', theme);
          el.setAttribute('lang', lang);
          el.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static first paint (replaced by React): logo + skeleton, no text so it suits both languages -->
      <div style="max-width: 1920px; margin: 0 auto; padding: 12px">
        <div
          class="glass"
          style="display: flex; align-items: center; gap: 12px; padding: 12px 16px"
        >
          <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#0b1630" />
            <path
              d="M10 44 C22 44 24 22 34 22 S46 36 54 18"
              fill="none"
              stroke="#d95926"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M10 50 H54"
              stroke="#3987e5"
              stroke-width="3"
              stroke-linecap="round"
              stroke-dasharray="4 5"
            />
          </svg>
          <div class="skeleton" style="height: 20px; width: min(320px, 50vw)"></div>
        </div>
        <div class="skeleton" style="height: 96px; margin-top: 16px"></div>
        <div class="skeleton" style="height: 320px; margin-top: 16px"></div>
      </div>
    </div>
    <noscript
      >این برنامه برای اجرا به جاوااسکریپت نیاز دارد. / This app requires JavaScript.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
